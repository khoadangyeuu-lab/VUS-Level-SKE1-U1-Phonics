<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look Starter: Unit 1 – L4 Phonics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B4F; --ink-soft:#5A6788;
  --paper:#F2F7FF; --grid:#DFEAFB; --card:#FFFFFF; --line:#D4E0F3;
  --sun:#FFC93C; --sun-deep:#D9A112;
  --grass:#25A96A; --grass-deep:#1A7F4F;
  --berry:#E5484D; --berry-deep:#B32F34;
  --c-apple:#CC3344; --c-bag:#277A8A; --c-cake:#7A4B36;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; min-height:100dvh; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px clamp(16px,4vw,40px)}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{width:52px;height:52px;border-radius:16px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);display:grid;place-items:center;flex:none;color:var(--ink)}
.brand-badge svg{width:30px;height:30px}
.brand small{display:block;font-weight:800;color:var(--ink-soft);font-size:.9rem;letter-spacing:.01em}
.brand h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.1}
.tabs{display:flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px;gap:4px}
.tab{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;padding:10px 20px;border-radius:999px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--paper)}
main{padding:0 clamp(16px,4vw,40px) 32px}
.view[hidden]{display:none}

/* chunky buttons */
.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.is-on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #0E1630}
.btn-primary{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);font-size:1.2rem;padding:14px 28px;color:var(--ink)}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-icon{padding:11px;border-radius:50%}
.sound-toggle{position:fixed;right:18px;bottom:18px;z-index:10;background:#fff}

/* flashcards */
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px auto 22px}
.toolbar .hint{color:var(--ink-soft);font-weight:700;margin-left:8px}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fc{perspective:1200px;aspect-ratio:5/4;position:relative;z-index:3;container-type:inline-size}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.fc.is-word .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.face-pic{background:var(--card);border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,white)}
.face-pic::before{content:"";position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--c) 13%,white)}
.face-pic img{position:relative;width:78%;height:88%;object-fit:contain;pointer-events:none;user-select:none}
/* first letter: a white chip behind it, tall enough to hold tails like g or p */
.face-word .lead{display:inline-block;font-weight:inherit;line-height:1.2;padding:0 .14em .05em;margin-right:.06em;border-radius:.24em;background:#fff;color:var(--c);text-shadow:none;box-shadow:0 .07em 0 color-mix(in srgb,var(--c) 55%,black)}
.face-word{transform:rotateY(180deg);background:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff;container-type:inline-size}
.face-word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(17cqw,4.6rem);letter-spacing:.01em;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.fc button.flip{position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}
.speak{position:absolute;right:clamp(5px,5cqw,14px);bottom:clamp(5px,5cqw,14px);width:clamp(24px,15cqw,44px);height:clamp(24px,15cqw,44px);border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;z-index:2;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s .2s}
.fc.is-word .speak{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s .3s,visibility 0s .3s}
.speak:hover{background:rgba(255,255,255,.36)}
.speak svg{width:52%;height:52%}

/* matching board (flashcards tab) */
.board{--gap:clamp(64px,11dvh,100px);--cw:calc((100dvh - 285px - var(--gap)) / 1.4);--w:min(940px,max(540px,calc(var(--cw) * 3 + 40px)));width:min(100%,var(--w));margin:0 auto;position:relative;user-select:none;-webkit-user-select:none}
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:var(--gap)}
.ltr{aspect-ratio:5/3;position:relative;z-index:3;border-radius:var(--r-lg);background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);display:grid;place-items:center;container-type:inline-size;touch-action:none;transition:transform .08s,box-shadow .08s,background .2s,border-color .2s}
.ltr b{font-family:"Fredoka",sans-serif;font-weight:600;font-size:min(34cqw,4.8rem);line-height:1;color:var(--ink);letter-spacing:.02em}
.ltr:hover{border-color:var(--ink-soft)}
.ltr:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.ltr.sel{border-color:var(--ink);box-shadow:0 7px 0 var(--ink)}
.ltr.no{border-color:var(--berry);box-shadow:0 7px 0 var(--berry-deep);animation:shake .4s}
.ltr.done{background:var(--c);border-color:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,black);cursor:default;pointer-events:none}
.ltr.done b{color:#fff;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.node,.node-mark{width:32px;height:32px;border-radius:50%;background:#fff;border:3.5px solid var(--ink);position:absolute;left:50%;margin-left:-16px;z-index:3;transition:transform .12s,background .2s,box-shadow .2s}
.fc .node{bottom:-16px;touch-action:none;cursor:grab}
.fc .node::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.ltr .node-mark{top:-16px;pointer-events:none}
.fc .node:hover{transform:scale(1.15)}
.node.sel,.ltr.sel .node-mark{background:var(--ink);box-shadow:0 0 0 7px rgba(30,43,79,.16)}
.fc.done .node,.ltr.done .node-mark{background:var(--c);border-color:color-mix(in srgb,var(--c) 70%,black)}
.fc.done .node{cursor:default}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.wire{fill:none;stroke-width:7;stroke-linecap:round}
.wire.case{stroke:#fff;stroke-width:15}
.ltr.just{animation:settle .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes settle{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.conf{position:fixed;z-index:50;pointer-events:none;will-change:transform,opacity}
.wire.fresh{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out forwards}
.wire.tmp{stroke:var(--ink-soft);stroke-dasharray:2 13;stroke-width:6}
.wire.bad{stroke:var(--berry)}
@keyframes draw{to{stroke-dashoffset:0}}

/* game */
.game{width:min(100%,1180px);margin:0 auto}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.round-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;display:flex;align-items:center;gap:12px}
.chip{font-weight:800;font-size:.9rem;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .25s}
.dot.cur{border-color:var(--ink);transform:scale(1.25)}
.dot.ok{background:var(--grass);border-color:var(--grass)}
.dot.no{background:var(--berry);border-color:var(--berry)}
.score{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.score svg{width:26px;height:26px;fill:var(--sun);stroke:var(--sun-deep)}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.stage{--w:min(1180px,max(480px,calc((100dvh - 390px) * 4 + 120px)));width:min(100%,var(--w));margin:0 auto 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:26px 26px 36px;background:#fff;border:3px solid var(--line);border-radius:32px;box-shadow:0 8px 0 var(--line)}
.tile{aspect-ratio:1/1;border-radius:22px;display:grid;place-items:center;position:relative;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);container-type:inline-size;transition:transform .08s,translate .25s,rotate .2s,box-shadow .08s,border-color .2s,background .3s}
.stage .tile:nth-child(odd){rotate:-1deg}
.stage .tile:nth-child(even){rotate:1deg}
.tile:not(:disabled):hover,.tile.revealed{rotate:0deg}
.tile::before{content:"";position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;border-radius:50%;translate:-50% -50%;background:transparent;transition:background .3s}
.tile.letter::before{display:none}
.tile.picture.revealed::before{background:color-mix(in srgb,var(--c) 13%,white)}
.tile img{position:relative;width:80%;height:80%;object-fit:contain;pointer-events:none}
.tile .tag{position:absolute;left:0;right:0;bottom:-17px;margin:auto;width:max-content;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1rem;line-height:1;padding:6px 15px;border-radius:999px;background:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black);opacity:0;pointer-events:none;z-index:2}
.tile.revealed .tag{opacity:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1) .12s both}
.tile.reveal:not(.wrong){translate:0 -8px}
#btnNext{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tile .glyph{font-family:"Fredoka",sans-serif;font-weight:600;font-size:46cqw;line-height:1;color:var(--ink);pointer-events:none}
.tile .key{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center;z-index:2}
.tile:not(:disabled):hover{border-color:var(--ink-soft)}
.tile:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.tile:disabled{cursor:default}
.tile.revealed{border-color:color-mix(in srgb,var(--c) 30%,white);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,white)}
.tile.letter.revealed{background:var(--c);border-color:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,black)}
.tile.letter.revealed .glyph{color:#fff;text-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black)}
.tile.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tile.reveal::after{content:"";position:absolute;inset:-9px;border-radius:28px;border:4px solid var(--grass)}
.tile.reveal.wrong{animation:shake .4s}
.tile.reveal.wrong::after{border-color:var(--berry)}
.stage.dealing .tile{animation:deal .45s cubic-bezier(.3,1.4,.5,1) both}
.stage.dealing .tile:nth-child(2){animation-delay:.07s}
.stage.dealing .tile:nth-child(3){animation-delay:.14s}
.stage.dealing .tile:nth-child(4){animation-delay:.21s}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.9)}}
.panel{margin-top:26px;text-align:center;min-height:120px}
.question{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin-bottom:12px}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;margin:10px 0 12px;min-height:1.7em;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.feedback .btn{color:var(--ink)}
.feedback.good{color:var(--grass-deep)}
.feedback.bad{color:var(--berry-deep)}
.feedback.prompt{color:var(--ink-soft);font-family:"Nunito",sans-serif;font-weight:700;font-size:1.1rem}
#mstatus{margin-top:30px}

/* end screen */
.result{width:min(100%,560px);margin:30px auto 0;background:#fff;border-radius:32px;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);padding:40px 28px;text-align:center}
.result[hidden]{display:none}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.stars svg{width:62px;height:62px;fill:#fff;stroke:var(--line)}
.stars svg:nth-child(2){transform:translateY(-14px);width:76px;height:76px}
.stars .on{fill:var(--sun);stroke:var(--sun-deep);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.15s}
.stars .on:nth-child(3){animation-delay:.3s}
.result h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.4rem}
.result p{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:6px 0 26px}
.result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

@media (max-width:640px){
  .tab span{display:none} .tab{padding:10px 16px}
  .deck,.letters{gap:10px}
  .board{--w:100%}
  .face-word span{font-size:min(20cqw,2.2rem)}
  .ltr{border-radius:18px}
  .face{border-radius:18px}
  .node,.node-mark{width:26px;height:26px;margin-left:-13px}
  .fc .node{bottom:-13px} .ltr .node-mark{top:-13px}
  .speak{top:clamp(5px,5cqw,8px);bottom:auto}
  .face-word{padding-top:12%}
  .stage{grid-template-columns:repeat(2,1fr);gap:32px 14px;--w:min(100%,420px);padding:14px 14px 26px;border-radius:24px;margin-bottom:12px}
  .tile{border-radius:16px}
  .panel{margin-top:16px;min-height:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>

  <symbol id="i-aa" viewBox="0 0 24 24"><path d="M2.5 19 8 5l5.5 14"/><path d="M4.7 14h6.6"/><circle cx="18" cy="15.2" r="3.1"/><path d="M21.1 12v7"/></symbol>
  <symbol id="i-odd" viewBox="0 0 24 24"><circle cx="6.5" cy="7.5" r="3.2"/><circle cx="17.5" cy="7.5" r="3.2"/><rect x="8.8" y="13.8" width="6.4" height="6.4" rx="1.6"/></symbol>

  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></symbol>

  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9z"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <div class="brand-badge"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg></div>
    <div><small>Look Starter</small><h1>Unit 1 – L4 Phonics</h1></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Activities">
    <button class="tab" role="tab" id="tab-cards" aria-selected="true" aria-controls="view-cards"><svg class="i" aria-hidden="true"><use href="#i-pic"/></svg><span>Flashcards</span></button>
    <button class="tab" role="tab" id="tab-odd" aria-selected="false" aria-controls="view-odd"><svg class="i" aria-hidden="true"><use href="#i-odd"/></svg><span>Odd one out</span></button>
  </div>
</header>

<main>
  <section class="view" id="view-cards" role="tabpanel" aria-labelledby="tab-cards">
    <div class="toolbar">
      <button class="btn" id="btnPics"><svg class="i" aria-hidden="true"><use href="#i-pic"/></svg>Show all pictures</button>
      <button class="btn" id="btnWords"><svg class="i" aria-hidden="true"><use href="#i-aa"/></svg>Show all words</button>
      <button class="btn" id="btnShuffle"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg>Shuffle</button>
      <span class="hint">Tap a card to flip it</span>
    </div>
    <div class="board" id="board">
      <div class="deck" id="deck"></div>
      <div class="letters" id="letters"></div>
      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </div>
    <div class="feedback prompt" id="mstatus" aria-live="polite"></div>
  </section>

  <section class="view" id="view-odd" role="tabpanel" aria-labelledby="tab-odd" hidden>
    <div class="game">
      <div id="gameBody">
        <div class="gbar">
          <div class="round-label"><span id="roundTxt">Round 1 of 12</span><span class="chip"><svg class="i" aria-hidden="true"><use href="#i-odd"/></svg>Odd one out</span></div>
          <div class="dots" id="dots" aria-hidden="true"></div>
          <div class="score" id="score" aria-label="Score"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg><span id="scoreN">0</span></div>
        </div>
        <div class="stage" id="stage" role="group" aria-label="Choose the odd one out"></div>
        <div class="panel">
          <p class="question">Which one is the odd one out?</p>
          <div class="feedback prompt" id="fb" aria-live="polite"></div>
        </div>
      </div>
      <div class="result" id="result" hidden>
        <div class="stars" id="stars"></div>
        <h2 id="resTitle">Super!</h2>
        <p id="resText">You got 8 out of 10.</p>
        <div class="row">
          <button class="btn btn-primary" id="btnAgain"><svg class="i" aria-hidden="true"><use href="#i-replay"/></svg>Play again</button>
          <button class="btn" id="btnBack"><svg class="i" aria-hidden="true"><use href="#i-pic"/></svg>Back to flashcards</button>
        </div>
      </div>
    </div>
  </section>
</main>

<button class="btn btn-icon sound-toggle" id="sound" aria-label="Sound on" aria-pressed="true"><svg class="i" aria-hidden="true"><use href="#i-speaker"/></svg></button>

<script>
(()=>{
const WORDS=[
  {w:"apple",big:"A",small:"a"},
  {w:"bag",big:"B",small:"b"},

const KEYS=WORDS.map(x=>x.w), by=Object.fromEntries(WORDS.map(x=>[x.w,x]));
const $=(s,r=document)=>r.querySelector(s);
const ic=(n,c="i")=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/* ---------- sound ---------- */
let soundOn=true, actx=null;
function tone(freqs,dur=.12,type="sine",vol=.18){ if(!soundOn) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.85;});}catch(e){} }
const sfx={flip:()=>tone([660],.08,"triangle",.12), good:()=>tone([523,659,784,1047],.13,"triangle",.2),
  bad:()=>tone([300,220],.18,"sawtooth",.08), fan:()=>tone([523,659,784,1047,1319],.12,"triangle",.2)};
function say(word){ if(!soundOn||!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word); u.lang="en-US"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
$("#sound").addEventListener("click",e=>{
  soundOn=!soundOn; const b=e.currentTarget;
  b.innerHTML=ic(soundOn?"speaker":"mute"); b.setAttribute("aria-label",soundOn?"Sound on":"Sound off"); b.setAttribute("aria-pressed",String(soundOn));
  if(!soundOn&&"speechSynthesis" in window) try{speechSynthesis.cancel()}catch(_){}
});

/* ---------- helpers ---------- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function derange(base){let p;do{p=shuffle(base);}while(p.some((x,i)=>x===base[i]));return p;}
function spacedSeq(items,rounds,gap,avoid=()=>false){ const seq=[],used=new Map(items.map(i=>[i,0]));
  for(let r=0;r<rounds;r++){ const recent=seq.slice(-gap), prev=seq[seq.length-1];
    let pool=items.filter(i=>!recent.includes(i)); const far=pool.filter(i=>prev===undefined||!avoid(i,prev)); if(far.length) pool=far;
    const min=Math.min(...pool.map(i=>used.get(i))); pool=pool.filter(i=>used.get(i)===min);
    const pick=pool[Math.random()*pool.length|0]; seq.push(pick); used.set(pick,used.get(pick)+1);} return seq; }

/* small confetti burst; shapes are solid colors from the word palette */
function burst(x,y,n=16,vars=["--sun"]){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<n;i++){
    const el=document.createElement("i"), s=8+Math.random()*8, a=Math.random()*Math.PI*2, d=50+Math.random()*(n>20?170:90);
    el.className="conf";
    el.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${Math.random()<.5?s:s*.55}px;background:var(${vars[i%vars.length]});border-radius:${Math.random()<.5?"50%":"3px"}`;
    document.body.appendChild(el);
    const an=el.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+70}px)) scale(1) rotate(${(Math.random()-.5)*540}deg)`,opacity:0}
    ],{duration:800+Math.random()*500,easing:"cubic-bezier(.2,.7,.3,1)"});
    an.onfinish=()=>el.remove();
  }
}

/* ---------- flashcards + matching ---------- */
const deck=$("#deck"), letters=$("#letters"), board=$("#board"), wires=$("#wires"), mstatus=$("#mstatus");
const btnPics=$("#btnPics"), btnWords=$("#btnWords");
const PROMPT="Connect each picture to its letter.";
let order=[...KEYS], lorder=derange(order), flipped={}, matched={}, sel=null, wrong=[], drag=null, lastNew=null, stTimer=null;

function newL(){ let l,n=0; do{ l=derange(order); }while(++n<50&&l.every((x,i)=>x===lorder[i])); return l; }   // a re-shuffle never repeats the previous letter order
const cardEl=w=>deck.querySelector(`.fc[data-w="${w}"]`);
const nodeEl=w=>deck.querySelector(`.node[data-w="${w}"]`);
const ltrEl=w=>letters.querySelector(`.ltr[data-w="${w}"]`);

function renderBoard(){
  deck.innerHTML=order.map(w=>`
    <div class="fc${flipped[w]?" is-word":""}" data-w="${w}" style="--c:var(--c-${w})">
      <div class="fc-inner">
        <div class="face face-pic"><img src="${IMGS[w]}" alt="${w}"></div>
        <div class="face face-word"><span><b class="lead">${w[0]}</b>${w.slice(1)}</span></div>
      </div>
      <button class="flip" aria-label="Flip the ${w} card"></button>
      <button class="speak" data-say="${w}" aria-label="Say ${w}">${ic("speaker")}</button>
      <button class="node" data-kind="pic" data-w="${w}" aria-label="Connect ${w} to its letter" aria-pressed="false"></button>
    </div>`).join("");
  letters.innerHTML=lorder.map(w=>`
    <button class="ltr" data-kind="ltr" data-w="${w}" style="--c:var(--c-${w})" aria-label="Letter ${by[w].big}${by[w].small}">
      <i class="node-mark"></i><b>${by[w].big}${by[w].small}</b>
    </button>`).join("");
  mark(); syncFlipButtons(); setStatus(PROMPT,"prompt");
  requestAnimationFrame(drawWires);
}
function mark(){
  deck.querySelectorAll(".fc").forEach(el=>{
    const w=el.dataset.w, n=$(".node",el), on=!!sel&&sel.kind==="pic"&&sel.key===w;
    el.classList.toggle("done",!!matched[w]); n.classList.toggle("sel",on); n.setAttribute("aria-pressed",String(on));
  });
  letters.querySelectorAll(".ltr").forEach(el=>{
    const w=el.dataset.w;
    el.classList.toggle("done",!!matched[w]); el.classList.toggle("sel",!!sel&&sel.kind==="ltr"&&sel.key===w);
  });
}
let statusSeq=0;
function setStatus(t,cls="",extra=""){ statusSeq++; mstatus.className="feedback "+cls; mstatus.innerHTML=`<span>${t}</span>${extra}`; }
function syncFlipButtons(){
  btnPics.classList.toggle("is-on",order.every(w=>!flipped[w]));
  btnWords.classList.toggle("is-on",order.every(w=>!!flipped[w]));
}

/* flipping */
deck.addEventListener("click",e=>{
  const f=e.target.closest(".flip");
  if(f){ const w=f.closest(".fc").dataset.w; flipped[w]=!flipped[w]; cardEl(w).classList.toggle("is-word",flipped[w]); sfx.flip(); if(flipped[w]) say(w); syncFlipButtons(); return; }
  const s=e.target.closest(".speak"); if(s) say(s.dataset.say);
});
function flipAll(toWord){
  sfx.flip();
  order.forEach((w,i)=>setTimeout(()=>{ flipped[w]=toWord; const c=cardEl(w); if(c) c.classList.toggle("is-word",toWord); syncFlipButtons(); },i*70));
}
btnPics.addEventListener("click",()=>flipAll(false));
btnWords.addEventListener("click",()=>flipAll(true));

function resetMatches(){ matched={}; wrong=[]; sel=null; drag=null; }
btnShuffle.addEventListener("click",()=>{
  let o; do{o=shuffle(KEYS);}while(o.every((x,i)=>x===order[i]));
  order=o; lorder=newL(); resetMatches(); sfx.flip(); renderBoard();
});
mstatus.addEventListener("click",e=>{
  if(e.target.closest("#again")){ lorder=newL(); resetMatches(); renderBoard(); }
});

/* wires */
function ctr(el,b){const r=el.getBoundingClientRect();return [r.left+r.width/2-b.left,r.top+r.height/2-b.top];}
function curve(w,L,b){
  const [x1,y1]=ctr(nodeEl(w),b), [x2,y2]=ctr($(".node-mark",ltrEl(L)),b), k=(y2-y1)*.5;
  return `M${x1} ${y1} C${x1} ${y1+k} ${x2} ${y2-k} ${x2} ${y2}`;
}
/* while a letter card bounces or shakes its dot moves, so keep the wire ends glued to the dots (moves only the path, never re-creates it) */
function updateWires(){ const b=board.getBoundingClientRect(); wires.querySelectorAll("path[data-w]").forEach(p=>p.setAttribute("d",curve(p.dataset.w,p.dataset.l,b))); }
function follow(ms=650){ const t0=performance.now(); (function f(){ updateWires(); if(performance.now()-t0<ms) requestAnimationFrame(f); })(); }
function drawWires(){
  const b=board.getBoundingClientRect(); if(!b.width||!deck.children.length) return;
  wires.setAttribute("viewBox",`0 0 ${b.width} ${b.height}`);
  let h="";
  for(const w of Object.keys(matched)){
    const d=curve(w,w,b), f=w===lastNew?" fresh":"";
    h+=`<path class="wire case${f}" data-w="${w}" data-l="${w}" pathLength="1" d="${d}"/><path class="wire${f}" data-w="${w}" data-l="${w}" pathLength="1" style="stroke:var(--c-${w})" d="${d}"/>`;
  }
  for(const x of wrong){ const d=curve(x.w,x.L,b); h+=`<path class="wire case" data-w="${x.w}" data-l="${x.L}" d="${d}"/><path class="wire bad" data-w="${x.w}" data-l="${x.L}" d="${d}"/>`; }
  if(drag&&drag.moved){
    const o=drag.kind==="pic"?nodeEl(drag.key):$(".node-mark",ltrEl(drag.key));
    const [x1,y1]=ctr(o,b);
    h+=`<path class="wire tmp" d="M${x1} ${y1} L${drag.x-b.left} ${drag.y-b.top}"/>`;
  }
  wires.innerHTML=h;
}
new ResizeObserver(()=>drawWires()).observe(board);
window.addEventListener("resize",drawWires);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawWires);

/* connecting: drag a dot to a letter (or the other way), or tap one then the other */
function attempt(w,L){
  sel=null;
  if(w===L){
    matched[w]=true; lastNew=w; mark(); drawWires(); lastNew=null;
    const lt=ltrEl(w); lt.classList.add("just"); setTimeout(()=>lt.classList.remove("just"),600); follow(650);
    const lr=lt.getBoundingClientRect(); burst(lr.left+lr.width/2,lr.top+lr.height/2,12,[`--c-${w}`,"--sun"]);
    sfx.good(); say(w);
    if(Object.keys(matched).length===KEYS.length){
      setStatus("All matched! Great job!","good",`<button class="btn btn-primary" id="again">${ic("replay")}Match again</button>`);
      setTimeout(()=>{ sfx.fan(); const r=board.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,44,["--c-apple","--c-bag","--c-cake","--sun"]); },380);
    } else setStatus(`Yes! ${by[w].big}${by[w].small} is for ${w}.`,"good");
  } else {
    const item={w,L}; wrong.push(item); mark(); drawWires(); sfx.bad();
    const el=ltrEl(L); el.classList.add("no"); follow(450);
    setStatus("Oops! Try again.","bad"); const seq=statusSeq;
    setTimeout(()=>{                              // each wrong try cleans up after itself, so fast taps never leave a red wire behind
      wrong=wrong.filter(x=>x!==item); if(!wrong.some(x=>x.L===L)) el.classList.remove("no"); drawWires();
      if(statusSeq===seq&&Object.keys(matched).length<KEYS.length) setStatus(PROMPT,"prompt"); },900);
  }
}
function clickSelect(kind,key){
  if(sel&&sel.kind!==kind){
    const s=sel; attempt(kind==="pic"?key:s.key, kind==="pic"?s.key:key); return;
  }
  sel=(sel&&sel.kind===kind&&sel.key===key)?null:{kind,key}; mark();
}
board.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".node[data-kind='pic'], .ltr"); if(!t) return;
  const key=t.dataset.w; if(matched[key]) return;
  drag={kind:t.dataset.kind==="ltr"?"ltr":"pic",key,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,moved:false};
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  drag.x=e.clientX; drag.y=e.clientY;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  if(drag.moved) drawWires();
});
document.addEventListener("pointerup",e=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.moved){
    drawWires();
    const t=document.elementFromPoint(e.clientX,e.clientY);
    if(d.kind==="pic"){ const l=t&&t.closest(".ltr"); if(l&&!matched[l.dataset.w]) attempt(d.key,l.dataset.w); }
    else { const c=t&&t.closest(".fc"); if(c&&!matched[c.dataset.w]) attempt(c.dataset.w,d.key); }
  } else clickSelect(d.kind,d.key);
});
document.addEventListener("pointercancel",()=>{ if(drag){drag=null;drawWires();} });
board.addEventListener("click",e=>{            // keyboard activation only (pointer is handled above)
  if(e.detail!==0) return;
  const t=e.target.closest(".node[data-kind='pic'], .ltr"); if(!t||matched[t.dataset.w]) return;
  clickSelect(t.dataset.kind==="ltr"?"ltr":"pic",t.dataset.w);
});

/* ---------- odd one out ---------- */
const stage=$("#stage"), fb=$("#fb"), dotsEl=$("#dots"), N=12, TYPES=["pic","big","small"];
const HINT="Say the pictures and letters out loud, then tap the odd one.";
let g=null, dealT=null;

/* Balanced plan (12 rounds) – found by a randomised search:
   - every ordered pair "main group → odd group" appears exactly twice, so each group is the main group 4 times and the odd group 4 times
   - each kind of odd tile (picture / big / little) appears 4 times, and every (kind, grid slot) combination for the odd tile exactly once
   - the 12 rounds are 4 blocks of 3: inside a block the main group, the odd group and the odd kind are all different
   - the main group, the odd group, the odd kind never repeat in two rounds in a row; the odd slot never repeats within 2 rounds
   - the same pair never comes straight back swapped (A→B then B→A) more than SWAPMAX times (with 3 groups at least once is unavoidable)
   - the other three tiles are placed so every kind spreads over every slot as evenly as possible */
const spread=o=>{const v=Object.values(o);return Math.max(...v)-Math.min(...v);};
const SWAPMAX=3, ALLC=[];
KEYS.forEach(A=>KEYS.forEach(B=>{ if(A!==B) TYPES.forEach(type=>[0,1,2,3].forEach(slot=>ALLC.push({A,B,type,slot}))); }));
function searchSeq(limit=60000){
  const seq=[], pair={}, ks={}, trip=new Set(); let nodes=0, swaps=0;
  const isSwap=(p,x)=>p&&p.A===x.B&&p.B===x.A;
  function ok(x,i){
    if((pair[x.A+x.B]||0)>=2||ks[x.type+x.slot]||trip.has(x.A+x.B+x.type)) return false;
    if(i>0){ const p=seq[i-1]; if(p.A===x.A||p.B===x.B||p.type===x.type) return false; if(isSwap(p,x)&&swaps>=SWAPMAX) return false; }
    for(let k=1;k<=2;k++) if(i-k>=0&&seq[i-k].slot===x.slot) return false;
    for(let j=i-(i%3);j<i;j++){ const q=seq[j]; if(q.A===x.A||q.B===x.B||q.type===x.type) return false; }
    return true;
  }
  function rec(i){
    if(i===N) return true; if(++nodes>limit) return false;
    for(const x of shuffle(ALLC)){
      if(!ok(x,i)) continue;
      const sw=isSwap(seq[i-1],x); if(sw) swaps++;
      seq.push(x); pair[x.A+x.B]=(pair[x.A+x.B]||0)+1; ks[x.type+x.slot]=1; trip.add(x.A+x.B+x.type);
      if(rec(i+1)) return true;
      if(sw) swaps--; seq.pop(); pair[x.A+x.B]--; delete ks[x.type+x.slot]; trip.delete(x.A+x.B+x.type);
    }
    return false;
  }
  return rec(0)?seq.map(x=>({...x})):null;
}
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function makePlan(){
  for(let a=0;a<60;a++){
    const seq=searchSeq(); if(!seq) continue;
    const Ss=seq.map(x=>x.slot);
    const use={}, plan=[]; let prev=[];
    seq.forEach((x,r)=>{
      const S=Ss[r], base=[{kind:"pic",w:x.A},{kind:"big",w:x.A},{kind:"small",w:x.A}], free=[0,1,2,3].filter(i=>i!==S);
      let best=null, bc=1e9;
      for(const pm of PERMS){
        let c=Math.random()*.5;
        pm.forEach((bi,k)=>{ const kind=base[bi].kind, slot=free[k]; c+=(use[kind+slot]||0)*3+(prev[slot]===kind?2:0); });
        if(c<bc){bc=c;best=pm;}
      }
      const tiles=[]; tiles[S]={kind:x.type,w:x.B,odd:true}; best.forEach((bi,k)=>{tiles[free[k]]=base[bi];});
      tiles.forEach((t,i)=>{ use[t.kind+i]=(use[t.kind+i]||0)+1; }); prev=tiles.map(t=>t.kind);
      plan.push({A:x.A,B:x.B,type:x.type,slot:S,tiles});
    });
    const ks={}; TYPES.forEach(k=>[0,1,2,3].forEach(s=>ks[k+s]=use[k+s]||0));
    if(spread(ks)<=1) return {plan,ok:true};
  }
  return {plan:null,ok:false};
}
function buildPlan(){ for(let i=0;i<20;i++){ const r=makePlan(); if(r.ok) return r.plan; } throw new Error("plan"); }

function tileHTML(t,i){
  const x=by[t.w], inner=t.kind==="pic"?`<img src="${IMGS[t.w]}" alt="">`:`<span class="glyph">${t.kind==="big"?x.big:x.small}</span>`;
  const label=t.kind==="pic"?`Picture of a ${t.w}`:`Letter ${t.kind==="big"?x.big:x.small}`;
  return `<button class="tile ${t.kind==="pic"?"picture":"letter"}" data-i="${i}" data-kind="${t.kind}" data-w="${t.w}" ${t.odd?'data-odd="1"':""} style="--c:var(--c-${t.w})" aria-label="${i+1}. ${label}">${inner}<span class="key">${i+1}</span><span class="tag">${t.w}</span></button>`;
}
function renderDots(){
  dotsEl.innerHTML=Array.from({length:N},(_,i)=>`<span class="dot${i===g.r?" cur":""}${g.res[i]===true?" ok":""}${g.res[i]===false?" no":""}"></span>`).join("");
}
function startGame(){
  g={r:0,score:0,answered:false,res:[],plan:buildPlan()};
  $("#gameBody").hidden=false; $("#result").hidden=true; $("#scoreN").textContent="0";
  renderRound();
}
function renderRound(){
  const p=g.plan[g.r]; g.answered=false;
  $("#roundTxt").textContent=`Round ${g.r+1} of ${N}`;
  stage.innerHTML=p.tiles.map(tileHTML).join("");
  stage.classList.remove("dealing"); void stage.offsetWidth; stage.classList.add("dealing");
  clearTimeout(dealT); dealT=setTimeout(()=>stage.classList.remove("dealing"),900);   // the deal animation must not outrank the reveal animations
  fb.className="feedback prompt"; fb.textContent=HINT;
  renderDots();
}
function choose(i){
  if(!g||g.answered) return; g.answered=true;
  clearTimeout(dealT); stage.classList.remove("dealing");
  const p=g.plan[g.r], ok=!!p.tiles[i].odd;
  stage.querySelectorAll(".tile").forEach((el,j)=>{
    el.disabled=true; el.classList.add("revealed");
    if(p.tiles[j].odd) el.classList.add("reveal"); else if(j===i) el.classList.add("reveal","wrong");
  });
  g.res[g.r]=ok;
  if(ok){ g.score++; $("#scoreN").textContent=g.score; const s=$("#score"); s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump"); sfx.good();
    const r=stage.children[i].getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,16,[`--c-${p.B}`,"--sun"]); } else sfx.bad();
  renderDots();
  const x=by[p.B], last=g.r===N-1;
  fb.className="feedback "+(ok?"good":"bad");
  fb.innerHTML=`<span>${ok?"Great job!":"Oops!"} ${ok?"":"The odd one is "}${x.big}${x.small} ${ok?"is ":""}for ${x.w}.</span><button class="btn btn-primary" id="btnNext">${last?"See results":"Next round"}${ic("next")}</button>`;
  say(x.w);
  $("#btnNext").focus({preventScroll:true});
}
stage.addEventListener("click",e=>{ const t=e.target.closest(".tile"); if(t) choose(+t.dataset.i); });
fb.addEventListener("click",e=>{
  if(!e.target.closest("#btnNext")) return;
  if(g.r===N-1) showResult(); else { g.r++; renderRound(); }
});
document.addEventListener("keydown",e=>{
  if($("#view-odd").hidden||!g||g.answered) return;
  if(/^[1-4]$/.test(e.key)) choose(+e.key-1);
});
function showResult(){
  g.answered=true; $("#gameBody").hidden=true; $("#result").hidden=false;
  const n=g.score, f=n/N, stars=f>=.9?3:f>=.6?2:f>=.3?1:0;
  $("#stars").innerHTML=[0,1,2].map(i=>ic("star",i<stars?"i on":"i")).join("");
  $("#resTitle").textContent=f>=.9?"Perfect!":f>=.6?"Super!":f>=.3?"Good work!":"Nice try!";
  $("#resText").textContent=`You got ${n} out of ${N}.`;
  if(stars) setTimeout(()=>{ sfx.fan(); if(stars>1) burst(innerWidth/2,230,48,["--c-apple","--c-bag","--c-cake","--sun"]); },250); else sfx.bad();
}
$("#btnAgain").addEventListener("click",startGame);
$("#btnBack").addEventListener("click",()=>show("cards"));

/* ---------- tabs ---------- */
function show(which){
  const cards=which==="cards";
  $("#view-cards").hidden=!cards; $("#view-odd").hidden=cards;
  $("#tab-cards").setAttribute("aria-selected",String(cards)); $("#tab-odd").setAttribute("aria-selected",String(!cards));
  if(!cards&&!g) startGame();
  if(cards) requestAnimationFrame(drawWires);
}
$("#tab-cards").addEventListener("click",()=>show("cards"));
$("#tab-odd").addEventListener("click",()=>show("odd"));

window.__lesson={plan:()=>g&&g.plan,order:()=>order,lorder:()=>lorder,makePlan,buildPlan,spacedSeq,N};
renderBoard();
})();
</script>
